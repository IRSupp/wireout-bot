name: wireout
x-runtime: &runtime
  image: ${WIREOUT_IMAGE:-boroumandhosein/wireout-bot:1.1.0}
  env_file:
    - path: ./app.env
      format: raw
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  db:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: wireout
      POSTGRES_DB: wireout
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run the installer first}
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U wireout -d wireout']
      interval: 5s
      timeout: 5s
      retries: 20
  init:
    <<: *runtime
    command: [init]
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
  bot:
    <<: *runtime
    command: [bot]
    depends_on:
      init:
        condition: service_completed_successfully
  web:
    <<: *runtime
    command: [web]
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  database:
